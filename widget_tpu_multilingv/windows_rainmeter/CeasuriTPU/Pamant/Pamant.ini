[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=0

[Variables]
; Marime in pixeli (latura discului). Implicit 360.
Marime=360
; Longitudine: 'auto' = din fusul orar al Windows; sau numar (grade est, negativ la vest)
Longitudine=auto
; Latitudine (grade nord) pentru punctul locului tau pe harta
Latitudine=44.4
; Limba / Language / Langue: auto (din setarile regionale Windows), ro, en, fr
Limba=auto
; Diacritice=0: texte fara diacritice (sigur). Pune 1 doar daca vrei diacritice si le vezi corect
Diacritice=0

[Baza]
Meter=Image
ImageName=#@#pamant_baza.png
X=0
Y=0
W=#Marime#
H=#Marime#
PreserveAspectRatio=1
AntiAlias=1

[Noapte]
Meter=Shape
Shape=Ellipse 0,0,1 | StrokeWidth 0
NoapteP=0,0 | LineTo 1,1

[ZonaLoc]
Meter=Shape
Shape=Path ZonaP | Fill Color 0,0,0,0 | StrokeWidth 2 | Stroke Color 242,162,75
ZonaP=0,0 | LineTo 1,1

[Meridian]
Meter=Shape
Shape=Ellipse 0,0,1 | StrokeWidth 0

[Subsolar]
Meter=Shape
Shape=Ellipse 0,0,1 | StrokeWidth 0

[Locul]
Meter=Shape
Shape=Ellipse 0,0,1 | StrokeWidth 0

[Luna]
Meter=Shape
Shape=Ellipse 0,0,1 | StrokeWidth 0
LunaP=0,0 | LineTo 1,1

