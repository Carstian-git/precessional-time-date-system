FontColor=11,19,34
FontSize=7
StringStyle=Bold
AntiAlias=1

[PanouFundal]
Meter=Shape
Shape=Rectangle 0,#Marime#,#Marime#,116,10 | Fill Color 16,21,31,240 | StrokeWidth 1.5 | Stroke Color 44,54,80

[Ora]
Meter=String
X=(#Marime#/2)
Y=(#Marime#+24)
Text=--
StringAlign=CenterCenter
FontFace=Consolas
FontColor=255,255,255
FontSize=17
StringStyle=Bold
AntiAlias=1

