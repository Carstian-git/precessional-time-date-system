[Locale]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegSubKey=Control Panel\International
RegValue=LocaleName
UpdateDivider=-1

[Script]
Measure=Script
ScriptFile=#@#pamant.lua
